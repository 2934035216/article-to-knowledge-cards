server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lizhenqi_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&createDatabaseIfNotExist=false
    username: root
    password: djsy02165514
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      idle-timeout: 10000
