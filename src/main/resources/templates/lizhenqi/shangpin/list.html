<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理 - 商品管理系统</title>
    <link rel="stylesheet" th:href="@{/lizhenqi/css/app.css}">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="logo">
            <span class="logo-mark">SP</span>
            <span class="logo-title">商品管理系统</span>
        </div>
        <nav class="menu">
            <a class="menu-item" href="/">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>首页</span>
            </a>
            <a class="menu-item active" href="/lizhenqi/shangpin">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
                <span>商品管理</span>
            </a>
        </nav>
        <div class="sidebar-footer">李贞琦 · 商品管理系统</div>
    </aside>

    <div class="main">
        <header class="topbar">
            <div class="breadcrumb">
                <a href="/">首页</a>
                <span>/</span>
                <span class="current">商品管理</span>
            </div>
            <div class="user">
                <span class="avatar">李</span>
                <span>李贞琦</span>
            </div>
        </header>

        <main class="content">
            <div class="page-header">
                <div>
                    <h1>商品管理</h1>
                    <p class="page-desc" th:text="|共 ${lizhenqiShangpinList.size()} 条商品记录|">共 0 条商品记录</p>
                </div>
            </div>

            <div class="card">
                <form class="toolbar" action="/lizhenqi/shangpin" method="get">
                    <input class="el-input search-input" type="text" name="keyword" placeholder="搜索商品名称" th:value="${keyword}">
                    <button type="submit" class="btn btn-primary">搜索</button>
                    <a class="btn" href="/lizhenqi/shangpin">重置</a>
                    <a class="btn btn-primary spacer" href="/lizhenqi/shangpin/add">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        新增商品
                    </a>
                </form>

                <div class="table-wrap">
                    <table class="el-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>商品名称</th>
                            <th>类别</th>
                            <th>价格</th>
                            <th>库存</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${lizhenqiShangpinList.isEmpty()}">
                            <td colspan="7">
                                <div class="empty-state">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                                    </svg>
                                    <p>暂无商品数据</p>
                                </div>
                            </td>
                        </tr>
                        <tr th:each="shangpin : ${lizhenqiShangpinList}">
                            <td th:text="${shangpin.id}">1</td>
                            <td th:text="${shangpin.mingcheng}">商品名称</td>
                            <td>
                                <span class="tag" th:text="${shangpin.leibie} ?: '-'">类别</span>
                            </td>
                            <td class="price" th:text="${shangpin.jiage != null ? '¥ ' + shangpin.jiage : '-'}">¥ 0.00</td>
                            <td>
                                <span th:class="${shangpin.kucun != null && shangpin.kucun > 100 ? 'tag success' : (shangpin.kucun != null && shangpin.kucun > 10 ? 'tag warning' : 'tag danger')}"
                                      th:text="${shangpin.kucun != null ? shangpin.kucun : 0}">0</span>
                            </td>
                            <td th:text="${shangpin.chuangjianShijian != null ? #dates.format(shangpin.chuangjianShijian, 'yyyy-MM-dd HH:mm') : '-'}">2026-01-01 00:00</td>
                            <td class="actions">
                                <a class="btn-link" th:href="|/lizhenqi/shangpin/view/${shangpin.id}|">查看</a>
                                <a class="btn-link warning" th:href="|/lizhenqi/shangpin/edit/${shangpin.id}|">编辑</a>
                                <a class="btn-link danger" th:href="|/lizhenqi/shangpin/delete/${shangpin.id}|"
                                   onclick="return confirm('确定要删除该商品吗？')">删除</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
