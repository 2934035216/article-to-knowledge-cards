<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - 商品管理系统</title>
    <link rel="stylesheet" th:href="@{/lizhenqi/css/app.css}">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="logo">
            <span class="logo-mark">SP</span>
            <span class="logo-title">商品管理系统</span>
        </div>
        <nav class="menu">
            <a class="menu-item active" href="/">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>首页</span>
            </a>
            <a class="menu-item" href="/lizhenqi/shangpin">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
                <span>商品管理</span>
            </a>
        </nav>
        <div class="sidebar-footer">李贞琦 · 商品管理系统</div>
    </aside>

    <div class="main">
        <header class="topbar">
            <div class="breadcrumb">
                <span class="current">首页</span>
            </div>
            <div class="user">
                <span class="avatar">李</span>
                <span>李贞琦</span>
            </div>
        </header>

        <main class="content">
            <div class="hero">
                <h2>欢迎使用商品管理系统</h2>
                <p>基于 Spring Boot 与 Thymeleaf 构建的商品管理后台，支持商品信息的新增、编辑、查看、删除以及按名称模糊搜索。</p>
                <a class="btn" href="/lizhenqi/shangpin">
                    进入商品管理
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>
            </div>

            <div class="grid">
                <div class="feature">
                    <span class="icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        </svg>
                    </span>
                    <h3>商品管理</h3>
                    <p>商品列表、详情、新增与编辑，一站式维护商品基础信息。</p>
                </div>
                <div class="feature">
                    <span class="icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="7"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </span>
                    <h3>快速检索</h3>
                    <p>按商品名称模糊搜索，快速定位目标商品记录。</p>
                </div>
                <div class="feature">
                    <span class="icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                        </svg>
                    </span>
                    <h3>库存预警</h3>
                    <p>以标签颜色区分库存状态，低库存商品一眼可见。</p>
                </div>
            </div>

            <div class="section-title">技术栈</div>
            <div class="tech-list">
                <span class="tag primary">Java 8</span>
                <span class="tag primary">Spring Boot 2.7</span>
                <span class="tag primary">Spring Data JPA</span>
                <span class="tag primary">Thymeleaf</span>
                <span class="tag primary">MySQL 8</span>
                <span class="tag">Element Plus 风格</span>
            </div>
        </main>
    </div>
</div>
</body>
</html>
