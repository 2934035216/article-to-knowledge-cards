<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::page-main})}">
<head><title>公告管理</title></head>
<body>
<div th:fragment="page-main">
<section class="container page">
    <h2 class="page-title">📢 公告管理</h2>
    <div class="card">
        <h3>发布公告</h3>
        <form th:action="@{/admin/notice/save}" method="post">
            <div class="form-row">
                <label>标题</label>
                <input type="text" name="title" th:value="${notice.title}" required/>
            </div>
            <div class="form-row">
                <label>内容</label>
                <textarea name="content" rows="4" th:text="${notice.content}"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">发布</button>
        </form>
    </div>

    <table class="table" style="margin-top:15px">
        <thead><tr><th>ID</th><th>标题</th><th>发布时间</th><th>操作</th></tr></thead>
        <tbody>
        <tr th:each="n : ${notices}">
            <td th:text="${n.id}"></td>
            <td th:text="${n.title}"></td>
            <td th:text="${#temporals.format(n.createTime, 'yyyy-MM-dd HH:mm')}"></td>
            <td>
                <form th:action="@{/admin/notice/delete}" method="post">
                    <input type="hidden" name="id" th:value="${n.id}">
                    <button class="btn btn-sm btn-ghost" onclick="return confirm('确认删除？')">删除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</div></body>
</html>
