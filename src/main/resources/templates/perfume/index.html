<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::page-main})}">
<head>
    <meta charset="UTF-8">
    <title>香水推荐系统</title>
</head>
<body>
<div th:fragment="page-main">

<section class="hero">
    <div class="hero-inner">
        <h1>发现属于你的那一款香水</h1>
        <p class="hero-sub">基于 SpringBoot 的香水推荐系统 —— 智能匹配你的气味偏好</p>
        <form class="hero-search" th:action="@{/perfumes}" method="get">
            <input type="text" name="keyword" placeholder="搜索香水、品牌、香调...">
            <button type="submit">搜索</button>
        </form>
    </div>
</section>

<section class="container">

    <div th:if="${recommendations != null and !#lists.isEmpty(recommendations)}">
        <h2 class="section-title">✨ 为你推荐</h2>
        <div class="perfume-grid">
            <div class="perfume-card" th:each="p : ${recommendations}">
                <a th:href="@{/perfume/detail(id=${p.id})}" class="card-link">
                    <div class="perfume-img">
                        <img th:if="${p.imageUrl != null and !p.imageUrl.isEmpty()}" th:src="${p.imageUrl}" th:alt="${p.name}">
                        <span th:if="${p.imageUrl == null or p.imageUrl.isEmpty()}" th:text="${p.name.substring(0,1)}"></span>
                    </div>
                    <div class="perfume-info">
                        <h3 th:text="${p.name}">香水名</h3>
                        <p class="perfume-meta">
                            <span th:text="${p.brandName}">品牌</span>
                            <span class="price" th:text="'¥' + ${p.price}">价格</span>
                        </p>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <h2 class="section-title">🔥 热销榜</h2>
    <div class="perfume-grid">
        <div class="perfume-card" th:each="p : ${topSales}">
            <a th:href="@{/perfume/detail(id=${p.id})}" class="card-link">
                <div class="perfume-img">
                        <img th:if="${p.imageUrl != null and !p.imageUrl.isEmpty()}" th:src="${p.imageUrl}" th:alt="${p.name}">
                        <span th:if="${p.imageUrl == null or p.imageUrl.isEmpty()}" th:text="${p.name.substring(0,1)}"></span>
                    </div>
                <div class="perfume-info">
                    <h3 th:text="${p.name}">香水名</h3>
                    <p class="perfume-meta">
                        <span th:text="${p.brandName}">品牌</span>
                        <span class="price" th:text="'¥' + ${p.price}">价格</span>
                    </p>
                    <p class="sales" th:text="'已售 ' + ${p.sales} + ' 件'"></p>
                </div>
            </a>
        </div>
    </div>

    <h2 class="section-title">🆕 最新上架</h2>
    <div class="perfume-grid">
        <div class="perfume-card" th:each="p : ${newest}">
            <a th:href="@{/perfume/detail(id=${p.id})}" class="card-link">
                <div class="perfume-img">
                        <img th:if="${p.imageUrl != null and !p.imageUrl.isEmpty()}" th:src="${p.imageUrl}" th:alt="${p.name}">
                        <span th:if="${p.imageUrl == null or p.imageUrl.isEmpty()}" th:text="${p.name.substring(0,1)}"></span>
                    </div>
                <div class="perfume-info">
                    <h3 th:text="${p.name}">香水名</h3>
                    <p class="perfume-meta">
                        <span th:text="${p.brandName}">品牌</span>
                        <span class="price" th:text="'¥' + ${p.price}">价格</span>
                    </p>
                </div>
            </a>
        </div>
    </div>

</section>

</div></body>
</html>
