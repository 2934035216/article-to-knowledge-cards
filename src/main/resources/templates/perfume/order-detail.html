<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::page-main})}">
<head><title>订单详情</title></head>
<body>
<div th:fragment="page-main">
<section class="container page">
    <h2 class="page-title">订单详情</h2>
    <div class="card" th:if="${order}">
        <dl class="kv-list">
            <dt>订单号</dt><dd th:text="${order.orderNo}"></dd>
            <dt>香水ID</dt><dd th:text="${order.perfumeId}"></dd>
            <dt>数量</dt><dd th:text="${order.quantity}"></dd>
            <dt>单价</dt><dd>¥<span th:text="${order.price}"></span></dd>
            <dt>总价</dt><dd class="strong">¥<span th:text="${order.totalAmount}"></span></dd>
            <dt>状态</dt><dd><span class="badge" th:classappend="'badge-' + ${order.status}" th:text="${order.status}"></span></dd>
            <dt>收货人</dt><dd th:text="${order.receiverName}"></dd>
            <dt>电话</dt><dd th:text="${order.receiverPhone}"></dd>
            <dt>地址</dt><dd th:text="${order.receiverAddr}"></dd>
            <dt>创建时间</dt><dd th:text="${#temporals.format(order.createTime, 'yyyy-MM-dd HH:mm:ss')}"></dd>
        </dl>
        <a th:href="@{/orders}" class="btn btn-outline">返回订单列表</a>
    </div>
</section>
</div></body>
</html>
