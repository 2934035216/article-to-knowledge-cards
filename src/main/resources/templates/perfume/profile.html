<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::page-main})}">
<head><title>个人信息</title></head>
<body>
<div th:fragment="page-main">
<section class="container page">
    <h2 class="page-title">个人信息</h2>
    <div class="card">
        <form th:action="@{/profile}" method="post">
            <div class="form-row">
                <label>账号</label>
                <input type="text" th:value="${user.username}" disabled />
            </div>
            <div class="form-row">
                <label>角色</label>
                <span class="role-tag" th:text="${user.role}"></span>
            </div>
            <div class="form-row">
                <label>昵称</label>
                <input type="text" name="nickname" th:value="${user.nickname}" required />
            </div>
            <div class="form-row">
                <label>手机</label>
                <input type="text" name="phone" th:value="${user.phone}" />
            </div>
            <div class="form-row">
                <label>邮箱</label>
                <input type="text" name="email" th:value="${user.email}" />
            </div>
            <div class="form-row">
                <label>新密码（不修改请留空）</label>
                <input type="password" name="newPassword" />
            </div>
            <button type="submit" class="btn btn-primary">保存</button>
        </form>
    </div>
</section>
</div></body>
</html>
