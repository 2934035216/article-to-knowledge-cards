<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::page-main})}">
<head><title>个性化推荐</title></head>
<body>
<div th:fragment="page-main">
<section class="container page">
    <h2 class="page-title">✨ 个性化推荐</h2>

    <div class="card">
        <h3>我的偏好设置</h3>
        <form th:action="@{/preference/save}" method="post">
            <div class="form-row">
                <label>偏好品牌（按住 Ctrl 可多选）</label>
                <select name="brandIds" multiple size="6" style="height:150px">
                    <option th:each="b : ${brands}" th:value="${b.id}"
                            th:selected="${preference != null and preference.preferredBrands != null and preference.preferredBrands.contains(#strings.toString(b.id))}"
                            th:text="${b.name}"></option>
                </select>
            </div>
            <div class="form-row">
                <label>偏好分类</label>
                <select name="categoryIds" multiple size="6" style="height:150px">
                    <option th:each="c : ${categories}" th:value="${c.id}"
                            th:selected="${preference != null and preference.preferredCategories != null and preference.preferredCategories.contains(#strings.toString(c.id))}"
                            th:text="${c.name}"></option>
                </select>
            </div>
            <div class="form-row">
                <label>偏好香调（用逗号分隔）</label>
                <input type="text" name="notes"
                       th:value="${preference?.preferredNotes}"
                       placeholder="如：花香,木质,清新"/>
            </div>
            <button type="submit" class="btn btn-primary">保存偏好 & 刷新推荐</button>
        </form>
    </div>

    <h3 class="section-title">基于偏好为你推荐</h3>
    <div class="perfume-grid">
        <div class="perfume-card" th:each="p : ${recommendations}">
            <a th:href="@{/perfume/detail(id=${p.id})}" class="card-link">
                <div class="perfume-img">
                <img th:if="${p.imageUrl != null and !p.imageUrl.isEmpty()}" th:src="${p.imageUrl}" th:alt="${p.name}">
                <span th:if="${p.imageUrl == null or p.imageUrl.isEmpty()}" th:text="${p.name.substring(0,1)}"></span>
            </div>
                <div class="perfume-info">
                    <h3 th:text="${p.name}">香水名</h3>
                    <p class="perfume-meta">
                        <span th:text="${p.brandName}">品牌</span>
                        <span class="price" th:text="'¥' + ${p.price}">价格</span>
                    </p>
                </div>
            </a>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(recommendations)}" class="empty">请先设置偏好以获得推荐</div>
</section>
</div></body>
</html>
