<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::page-main})}">
<head><title>订单管理</title></head>
<body>
<div th:fragment="page-main">
<section class="container page">
    <h2 class="page-title">📦 订单管理</h2>
    <table class="table">
        <thead><tr>
            <th>订单号</th><th>用户</th><th>香水ID</th><th>数量</th><th>总额</th><th>状态</th><th>时间</th><th>操作</th>
        </tr></thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="${o.orderNo}"></td>
            <td th:text="${o.userId}"></td>
            <td th:text="${o.perfumeId}"></td>
            <td th:text="${o.quantity}"></td>
            <td>¥<span th:text="${o.totalAmount}"></span></td>
            <td><span class="badge" th:classappend="'badge-' + ${o.status}" th:text="${o.status}"></span></td>
            <td th:text="${#temporals.format(o.createTime, 'yyyy-MM-dd HH:mm')}"></td>
            <td>
                <form th:action="@{/order/{id}/status(id=${o.id})}" method="post">
                    <select name="status">
                        <option value="PENDING" th:selected="${o.status == 'PENDING'}">待支付</option>
                        <option value="PAID" th:selected="${o.status == 'PAID'}">已支付</option>
                        <option value="SHIPPED" th:selected="${o.status == 'SHIPPED'}">已发货</option>
                        <option value="COMPLETED" th:selected="${o.status == 'COMPLETED'}">已完成</option>
                        <option value="CANCELED" th:selected="${o.status == 'CANCELED'}">已取消</option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-outline">更新</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</div></body>
</html>
